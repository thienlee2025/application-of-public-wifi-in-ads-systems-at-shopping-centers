[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; ===== ESP32-C3 Super Mini =====
board_build.flash_mode = dio
board_build.f_cpu = 160000000L

; ===== USB CDC =====
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

upload_port = COM5
monitor_port = COM5
monitor_speed = 115200

; ===== Upload speed =====
upload_speed = 460800

; ===== THƯ VIỆN CẦN DÙNG =====
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3